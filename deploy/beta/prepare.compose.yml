# Preparation only: no proxy, fixed addresses, public ports or Caddy state.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: dem_beta_admin
      POSTGRES_PASSWORD: ${DEM_BETA_ADMIN_PASSWORD:?set admin password}
      POSTGRES_DB: postgres
    command:
    - postgres
    - -c
    - shared_buffers=128MB
    - -c
    - max_connections=40
    volumes:
    - pgdata:/var/lib/postgresql
    networks:
    - database
    mem_limit: 512m
    restart: 'no'
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U dem_beta_admin -d postgres
      interval: 10s
      timeout: 5s
      retries: 12
  tools:
    image: ${DEM_BETA_API_IMAGE:-dem-beta-api:${DEM_BETA_COMMIT:?set full commit}}
    profiles:
    - tools
    entrypoint:
    - python
    - -m
    - scripts.beta_admin
    environment:
      DEM_BETA: '1'
      DEM_BETA_ADMIN_DATABASE_URL: postgresql+psycopg://dem_beta_admin:${DEM_BETA_ADMIN_PASSWORD:?set
        admin password}@db/postgres
      DEM_BETA_OWNER_PASSWORD: ${DEM_BETA_OWNER_PASSWORD:?set owner password}
      DEM_BETA_APP_PASSWORD: ${DEM_BETA_APP_PASSWORD:?set app password}
      DEM_BETA_COMMIT: ${DEM_BETA_COMMIT:?set full commit}
      DEM_BETA_RESET_SCHEDULE: ${DEM_BETA_RESET_SCHEDULE:-Mon 04:00 Asia/Tokyo}
      DEM_BETA_FLAG_DIR: /beta/flags
      DEM_BETA_STATUS_FILE: /beta/status/status.json
      DEM_BETA_STATE_DIR: /beta/state
      DEM_BETA_BACKUP_DIR: /beta/backups
    volumes:
    - ${DEM_BETA_HOME:?set runtime directory}/flags:/beta/flags
    - ${DEM_BETA_HOME:?set runtime directory}/status:/beta/status
    - ${DEM_BETA_HOME:?set runtime directory}/state:/beta/state
    - ${DEM_BETA_HOME:?set runtime directory}/backups:/beta/backups
    networks:
    - database
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 768m
    logging: *id001
networks:
  database:
    internal: true
volumes:
  pgdata:
    external: true
    name: ${DEM_BETA_DB_VOLUME:?set candidate volume}
