[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-mathdb"
version = "0.1.0"
description = "Mathematical theorem database core for Deus Ex Machina."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "filelock>=3.13",
  "pytest>=8.0",
  "pytest-xdist>=3.8",
]
postgres = [
  "psycopg>=3.1",
]
postgres-dev = [
  "psycopg[binary]>=3.1",
  "pytest-postgresql>=6.0",
]
webapi = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["dem*", "webapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "timing_sensitive: runtime diagnostic exercised serially by the supported test wrapper",
]
